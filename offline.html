<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MU MISTRY – Offline</title>
  <meta name="theme-color" content="#1D4ED8">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1D4ED8, #1E3A8A); color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
    .mark { width: 72px; height: 72px; border-radius: 20px; background: #fff; color: #1D4ED8; display: grid; place-items: center;
      font-weight: 800; font-size: 24px; margin: 0 auto 18px; }
    h1 { margin: 0 0 8px; font-size: 24px; } p { opacity: .9; max-width: 360px; margin: 0 auto 20px; }
    button { background: #fff; color: #1D4ED8; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
    small { display: block; margin-top: 30px; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <div class="mark">MU</div>
    <h1>You are offline</h1>
    <p>MU MISTRY needs an internet connection to book services and update your jobs. Please check your mobile data or Wi-Fi.</p>
    <button type="button" id="retry">Try again</button>
    <small>MU MISTRY · Your Trusted Home Service Partner · Developed by Debasis Rout</small>
  </main>
  <script src="./js/offline.js"></script>
</body>
</html>
